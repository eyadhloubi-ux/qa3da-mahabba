# نشر قعدة محبة على Render بضغطة (Blueprint)
services:
  - type: web
    name: qa3da-mahabba
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: STATS_KEY
        generateValue: true
